    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevent body scroll */
        }
        
        /* Custom Leaflet styles */
        .leaflet-control-zoom-in, .leaflet-control-zoom-out {
            background-color: white !important;
            color: #334155 !important;

        #side-panel {

            transform: translateX(-100%); /* Default for desktop */
        }

            transform: translateX(0);
        }
        
        /* --- Bottom sheet styles for mobile --- */
        @media (max-width: 767px) {

                transform: translateY(0); /* Slide into view */

        #side-panel-content::-webkit-scrollbar, #map-controls-scroll::-webkit-scrollbar {
            width: 8px;

        #side-panel-content::-webkit-scrollbar-thumb:hover, #map-controls-scroll::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        .info-legend {

        }
        .info-legend i {
            width: 18px;

            margin-right: 8px;

            border-radius: 4px;
            flex-shrink: 0;
        }
        .legend-item {
            display: flex;
            align-items: center;
        }
        .legend-item span {

        }
        
        #map-controls-container {
            transition: transform 0.3s ease-in-out;
        }
        
        /* This rule is universal: if it's minimized, it's off-screen. */
        #map-controls-container.minimized {
            transform: translateX(-120%);
        }

        /* On DESKTOP, slide the controls over ONLY IF they are NOT minimized */
        @media (min-width: 768px) {
            #side-panel.show ~ #map-controls-container:not(.minimized) {
                transform: translateX(calc(33.333vw + 1rem));
            }
        }
        @media (min-width: 1024px) {
            #side-panel.show ~ #map-controls-container:not(.minimized) {
                transform: translateX(calc(25vw + 1rem));
            }
        }
    
        /* Custom tooltip for explanations */
        .info-tooltip {
            position: relative;
            display: inline-block;
            outline: none;
        }
        .info-tooltip .tooltip-text {
            visibility: hidden;
            width: 250px;
            background-color: #334155;
            color: #fff;
            text-align: left;
            border-radius: 6px;
            padding: 10px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            right: 0;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.8rem;
            line-height: 1.4;
        }
        .info-tooltip:hover .tooltip-text,
        .info-tooltip:focus .tooltip-text {
            visibility: visible;
            opacity: 1;
        }
        
        /* Style adjustments for Mapbox Search input */
        .mapboxgl-ctrl-geocoder--input {
            min-width: 300px !important;
        }

            margin: 1rem 1rem 0 0;

            justify-content: center;
            align-items: center;

            width: 40px;
            height: 40px;

        }

            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

<script>
// --- GLOBAL STATE AND CONFIGURATION ---
let map; // Leaflet map object

let searchMarker; // Marker for the searched address
let showControlsControl; // To hold the "show" button control
const overlayLayers = {}; // To store and manage toggleable layers
let allIncentives = []; // To store all state and local incentives

const MAPBOX_ACCESS_TOKEN = 'pk.eyJ1IjoiYW1pbGxlci1tZGdvdiIsImEiOiJjbWc1ZW1hcm8wMWZ0MmtweWZtcmVxeTBtIn0.JS4bkhCiIv6oB_0WEQRpwg';
const TILESET_ID = 'amiller-mdgov.parcels-tileset';

const incentiveStyles = {

const INCENTIVE_AREA_MAP = {
    'enough_grantees': 'ENOUGH Act',
    'enterprise_zone_focus_areas': 'Enterprise Zone Focus Areas',
    'enterprise_zones': 'Enterprise Zones',
    'main_street_areas': 'Main Street Areas',
    'opportunity_zones': 'Opportunity Zones',
    'priority_funding_areas': 'Priority Funding Areas',
    'rise_zones': 'RISE Zones',
    'sustainable_communities': 'Sustainable Communities',
    'transit_oriented_development': 'Transit Oriented Development'
};

// --- HELPER FUNCTIONS ---
function safeParseFloat(value, defaultValue = null) {
    const parsed = parseFloat(value);
    return isNaN(parsed) ? defaultValue : parsed;
}
const formatPercent = (val) => `${(safeParseFloat(val, 0) * 100).toFixed(1)}%`;
const formatCurrency = (val) => `$${Math.round(safeParseFloat(val, 0)).toLocaleString()}`;
const formatNumber = (val) => (val != null) ? Math.round(safeParseFloat(val)).toLocaleString() : 'N/A';
const formatDate = (val) => (val != null && val) ? new Date(val).toLocaleDateString() : 'N/A';
const formatValue = (val) => (val != null) ? val : 'N/A';

function formatYmd(ymd) {
    if (!ymd || ymd.length !== 8) return 'N/A';
    const year = ymd.substring(0, 4);
    const month = ymd.substring(4, 6);
    const day = ymd.substring(6, 8);
    return `${month}/${day}/${year}`;
}

function truncateCommunityList(listString, maxVisible = 2) {
    if (!listString) return "Unnamed Area";
    const communities = listString.split(', ');
    if (communities.length <= maxVisible) return listString;
    const visibleCommunities = communities.slice(0, maxVisible);
    const hiddenCount = communities.length - maxVisible;
    const communityWord = hiddenCount === 1 ? 'community' : 'communities';
    return `${visibleCommunities.join(', ')} and ${hiddenCount} other ${communityWord}`;
}

document.addEventListener('DOMContentLoaded', async () => {
    const loadingOverlay = document.getElementById('loading-overlay'); // Get loader

    // --- MAP INITIALIZATION ---
    map = L.map('map', {
        center: [39.0458, -76.6413], // Centered on Maryland
        maxBounds: [[37.72521, -82], [39.90463, -74.60361]],
        zoom: 8,
        minZoom: 7,
        zoomControl: false 
    });
    
    // Create custom panes to control layer order
    map.createPane('countyPane');
    map.getPane('countyPane').style.zIndex = 475; // Above tracts, below incentives
    map.createPane('incentivePane');
    map.getPane('incentivePane').style.zIndex = 450;
    map.createPane('tractPane');
    map.getPane('tractPane').style.zIndex = 400;
    map.createPane('clusterTopPane');
    map.getPane('clusterTopPane').style.zIndex = 650;

    L.tileLayer('https://api.mapbox.com/styles/v1/mapbox/dark-v11/tiles/{z}/{x}/{y}?access_token={accessToken}', {
        attribution: '© <a href="https://www.mapbox.com/about/maps/">Mapbox</a> © <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        tileSize: 512,
        maxZoom: 18,
        zoomOffset: -1,
        accessToken: MAPBOX_ACCESS_TOKEN
    }).addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // --- DATA LOADING ---

        const [tractResponse, countyResponse, stateIncentivesResponse, localIncentivesResponse] = await Promise.all([
            fetch('tract_supply_demand_gap_simplified.geojson'),
            fetch('counties.geojson'),
            fetch('incentives/state_incentives_structured.json'),
            fetch('incentives/local_incentives_structured.json')
        ]);

        if (!tractResponse.ok || !countyResponse.ok || !stateIncentivesResponse.ok || !localIncentivesResponse.ok) {
            throw new Error('Network response was not ok');
        }

        const tractData = await tractResponse.json();
        const countyData = await countyResponse.json();
        const stateIncentives = await stateIncentivesResponse.json();
        const localIncentives = await localIncentivesResponse.json();
        
        // Combine state and local incentives into one array, extracting the structured data
        const processIncentives = (incentives, source) => {
            return incentives.map(inc => ({ ...inc.structured_extraction, source: source }));
        };
        allIncentives = [
            ...processIncentives(stateIncentives, 'State'),
            ...processIncentives(localIncentives, 'Local')
        ];
        
        const countyLayer = L.geoJSON(countyData, {
            style: {
                fillOpacity: 0, color: '#FFFFFF', weight: 2, opacity: 0.8
            },
            interactive: false, pane: 'countyPane'
        }).addTo(map);

        initializeMap(tractData);

        // Pre-load incentive area layers in the background
        await preloadPolygonLayers();

    } catch (error) {
        console.error('Failed to load map data:', error);
        alert('Could not load community or county data. The map may not function correctly.');
    } finally {
        loadingOverlay.classList.add('hidden'); // Hide loader
    }
});


function initializeMap(tractData) {
    // --- CHOROPLETH AND LEGEND LOGIC ---
    let currentVariable = 'childcare_unmet_demand';
    const legend = L.control({ position: 'bottomright' });
    const choroplethSelect = document.getElementById('choropleth-select');

    const choroplethOptions = {
        'childcare_unmet_demand': { label: 'Childcare Opportunity Score', format: (d) => formatNumber(d) },
        'childcare_supply_score': { label: 'Childcare Access Score', format: (d) => formatNumber(d) },
        'childcare_demand_score': { label: 'Childcare Demand Score', format: (d) => formatNumber(d) },
        'grocery_unmet_demand': { label: 'Fresh Food Opportunity Score', format: (d) => d.toFixed(2) },
        'grocery_supply_score': { label: 'Fresh Food Access Score', format: (d) => d.toFixed(2) },
        'grocery_demand_score': { label: 'Fresh Food Demand Score', format: (d) => d.toFixed(2) },
        'grocery_need_score': { label: 'Fresh Food Need', format: (d) => formatPercent(d) },
        'childcare_spending_per_under5': { label: 'Childcare Spending (per child)', format: (d) => formatCurrency(d) },
        'per_household_food_at_home': { label: 'Grocery spending (per household)', format: (d) => formatCurrency(d) },
        'pop2025': { label: 'Population (2025)', format: (d) => formatNumber(d) },
        'pop_change2530': { label: 'Projected Pop. Change (25-30)', format: (d) => formatNumber(d) },
        'avg_household_income': { label: 'Avg. Household Income', format: (d) => formatCurrency(d) },
        'transportation_barrier_pct': { label: '% Transportation Barriers', format: (d) => formatPercent(d) },
        'pct_under5': { label: '% Population Under 5', format: (d) => formatPercent(d) },
        'community_momentum_index': { label: 'Community Momentum Index', format: (d) => formatPercent(d) },
        'net_business_formations': { label: 'Net Business Formations (22-23)', format: (d) => formatPercent(d) },
        'job_growth_employees': { label: 'Job Growth (Employees, 22-23)', format: (d) => formatPercent(d) },
        'job_growth_payroll': { label: 'Job Growth (Payroll, 22-23)', format: (d) => formatPercent(d) },
        'license_growth_rate': { label: 'Business License Growth (22-23)', format: (d) => formatPercent(d) },
    };

    Object.keys(choroplethOptions).forEach(key => {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = choroplethOptions[key].label;
        choroplethSelect.appendChild(option);
    });
    choroplethSelect.value = currentVariable;
    
    // --- COLOR SCALES ---
    const sequentialColors = ['#eff3ff', '#bdd7e7', '#6baed6', '#3182bd', '#08519c'];
    const divergingColors = ['#e41d3d', '#f89747', '#fee8a0', '#a6d8f0', '#28a0cb', '#005ea2'].reverse();

    function isDivergingVariable(variable) {
        const divergingKeywords = ['unmet_demand', 'growth', 'net_business', 'formations', 'index', 'pop_change'];
        return divergingKeywords.some(keyword => variable.includes(keyword));
    }

    function getQuantiles(data, numQuantiles) {
        const sorted = data.filter(v => !isNaN(v)).sort((a, b) => a - b);
        if (sorted.length === 0) return [];
        const quantiles = [];
        for (let i = 1; i < numQuantiles; i++) {
            const pos = (sorted.length - 1) * (i / numQuantiles);
            const base = Math.floor(pos);
            const rest = pos - base;
            if (sorted[base + 1] !== undefined) {
                quantiles.push(sorted[base] + rest * (sorted[base + 1] - sorted[base]));
            } else {
                quantiles.push(sorted[base]);
            }
        }
        return quantiles;
    }

    function getDivergingBreaks(values) {
        return getQuantiles(values, divergingColors.length);
    }

    function getColor(d, breaks, colors) {
        if (colors.length === 6) { // Diverging
            return d > breaks[4] ? colors[5] : d > breaks[3] ? colors[4] : d > breaks[2] ? colors[3] : d > breaks[1] ? colors[2] : d > breaks[0] ? colors[1] : colors[0];
        } else { // Sequential
            return d > breaks[3] ? colors[4] : d > breaks[2] ? colors[3] : d > breaks[1] ? colors[2] : d > breaks[0] ? colors[1] : colors[0];
        }
    }

    function style(feature) {
        const isDiverging = isDivergingVariable(currentVariable);
        const values = tractData.features.map(f => safeParseFloat(f.properties[currentVariable])).filter(v => v !== null);
        if (values.length === 0) {
            return { fillColor: '#636363', weight: 0, color: 'white', fillOpacity: 0.7, pane: 'tractPane' };
        }
        const colors = isDiverging ? divergingColors : sequentialColors;
        const breaks = isDiverging ? getDivergingBreaks(values) : getQuantiles(values, colors.length);
        const value = safeParseFloat(feature.properties[currentVariable]);
        return {
            fillColor: (value === null) ? '#636363' : getColor(value, breaks, colors),
            weight: 0, opacity: 1, color: 'white', fillOpacity: 0.7, pane: 'tractPane'
        };
    }
    
    legend.onAdd = function (map) {

        if(values.length === 0) return div;
        const colors = isDiverging ? divergingColors : sequentialColors;
        let content = `<h4>${choroplethOptions[currentVariable].label}</h4>`;
        
        if (isDiverging) {
            if (currentVariable.includes('unmet_demand')) {
                content += `<div class="legend-item"><i style="background:${colors[5]}"></i><span>More Demand</span></div>`;
                content += `<div class="legend-item"><i style="background:${colors[2]}"></i><span>Balanced</span></div>`;
                content += `<div class="legend-item"><i style="background:${colors[0]}"></i><span>More Access</span></div>`;
            } else { // For growth rates
                content += `<div class="legend-item"><i style="background:${colors[5]}"></i><span>High Growth</span></div>`;
                content += `<div class="legend-item"><i style="background:${colors[2]}"></i><span>Stable</span></div>`;
                content += `<div class="legend-item"><i style="background:${colors[0]}"></i><span>Decline</span></div>`;
            }
        } else {
             const breaks = getQuantiles(values, colors.length);
             const formatter = choroplethOptions[currentVariable].format;
            for (let i = 0; i < colors.length; i++) {
                const from = i === 0 ? Math.min(...values) : breaks[i - 1];
                const to = i === colors.length - 1 ? Math.max(...values) : breaks[i];
                content += `<div class="legend-item"><i style="background:${colors[i]}"></i><span>${formatter(from)}${to ? ' &ndash; ' + formatter(to) : '+'}</span></div>`;
            }
        }
        content += `<div class="legend-item"><i style="background:#636363"></i><span>No Data</span></div>`;
        div.innerHTML = content;
        return div;
    };

    // A threshold of 10% means at least 10% of the tract must be covered by the incentive area.
    const OVERLAP_THRESHOLD_PERCENT = 10;

    function filterIncentives(industry, location) {
        if (!location || !allIncentives) return [];

        // Determine the county name from the location object
        const county = location.type === 'tract' ? location.feature.properties.county_name : location.tractProps.county_name;

        const reverseIncentiveMap = Object.fromEntries(
            Object.entries(INCENTIVE_AREA_MAP).map(([key, value]) => [value, key])
        );

        return allIncentives.filter(inc => {
            // --- Safely get properties, defaulting to empty arrays ---
            const eligibleOrganizationTypes = inc.eligible_organization_types || [];
            const eligibleIndustries = inc.list_of_eligible_industries || [];
            const prioritizedIndustries = inc.list_of_prioritized_industries || [];
            const incentiveAreas = inc.list_of_incentive_areas || [];
            const eligibleCounties = inc.list_of_eligible_counties || [];
            const prioritizedCounties = inc.list_of_prioritized_counties || [];

            if (!eligibleOrganizationTypes.includes('for-profit')) {
                return false;
            }

            // --- 1. Filter by Industry ---
            const industryMatch = eligibleIndustries.includes(industry) || prioritizedIndustries.includes(industry);
            if (!industryMatch) return false;

            // --- 2. Filter by Geography ---
            const countyMatch = eligibleCounties.includes('All') ||
                                eligibleCounties.includes(county) ||
                                prioritizedCounties.includes('All') ||
                                prioritizedCounties.includes(county);

            let incentiveAreaMatch = false;
            if (incentiveAreas.length > 0) {
                // --- LOGIC FOR TRACTS (Polygon Intersection) ---
                if (location.type === 'tract') {
                    const tractFeature = location.feature;
                    const tractArea = turf.area(tractFeature);

                    incentiveAreaMatch = incentiveAreas.some(humanName => {
                        const layerName = reverseIncentiveMap[humanName];
                        const incentiveLayer = overlayLayers[layerName];
                        if (!incentiveLayer || tractArea === 0) return false;

                        let totalIntersectionArea = 0;
                        const incentiveGeoJSON = incentiveLayer.toGeoJSON();

                        if (incentiveGeoJSON && incentiveGeoJSON.type === 'FeatureCollection' && incentiveGeoJSON.features) {
                            // Loop through each individual feature in the incentive layer
                            for (const incentiveFeature of incentiveGeoJSON.features) {
                                try {
                                    const intersection = turf.intersect(tractFeature, incentiveFeature);
                                    if (intersection) {
                                        totalIntersectionArea += turf.area(intersection);
                                    }
                                } catch (e) {
                                    console.error(`Turf.js intersection failed within filterIncentives for ${layerName}:`, e);
                                }
                            }
                        }

                        // Now, check if the total accumulated intersection area meets the threshold
                        if (totalIntersectionArea > 0) {
                            const percentage = (totalIntersectionArea / tractArea) * 100;
                            return percentage >= OVERLAP_THRESHOLD_PERCENT;
                        }
                        return false;
                    });
                }
                // --- LOGIC FOR ADDRESSES (Point in Polygon) ---
                else if (location.type === 'point') {
                    incentiveAreaMatch = incentiveAreas.some(humanName => {
                        const layerName = reverseIncentiveMap[humanName];
                        const layer = overlayLayers[layerName];
                        return layer && isPointInLayer_Turf(location.point, layer);
                    });
                }
            }

            return countyMatch || incentiveAreaMatch;
        });
    }

    async function queryParcelData(longitude, latitude) {
        const url = `https://api.mapbox.com/v4/${TILESET_ID}/tilequery/${longitude},${latitude}.json?access_token=${MAPBOX_ACCESS_TOKEN}`;
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Tilequery request failed');
            const data = await response.json();
            const parcel = data.features.find(f => f.properties.tilequery.layer === 'parcels_0825');
            return parcel ? parcel.properties : null;
        } catch (error) {
            console.error("Error fetching parcel data:", error);
            return null;
        }
    }
    
    function findTractForPoint(latlng) {
        let found = null;
        geojsonLayer.eachLayer(layer => {
            if (!found && isPointInLayer_Turf(latlng, layer)) found = layer.feature;
        });
        return found;
    }

            }
            
            // 2. Special check for Last Sale to ensure the price is greater than $0.
            const salePrice = safeParseFloat(parcelProps.CONSIDR1);
            if (salePrice > 0) {
                details.push(`<div class="bg-slate-50 p-2 rounded-md col-span-2"><span class="font-medium text-slate-600">Last Sale:</span> ${formatYmd(parcelProps.TRADATE)} for ${formatCurrency(salePrice)}</div>`);
            }

            // 3. Only build the "Parcel Details" section if we found at least one valid detail.
            if (details.length > 0) {
                parcelDetailsHTML = `
                    <div>
                        <h3 class="text-lg font-semibold text-slate-800 mb-2">Parcel Details</h3>
                        <div class="grid grid-cols-2 gap-2 text-sm">
                            ${details.join('')}
                        </div>
                    </div>`;
            }
        }

        // If parcelDetailsHTML is still empty, it means all data was missing.
        // Show a helpful message instead of the old yellow warning.
        if (!parcelDetailsHTML) {
            parcelDetailsHTML = `<p class="text-sm p-3 bg-blue-50 border-l-4 border-blue-400 text-blue-800 rounded-r-md">This is a general location. No specific parcel data is available. Search for a full address to see more details.</p>`;
        }

        if (tractProps) {
            // --- Filter incentives for the specific address point ---
            const location = { type: 'point', point: point, tractProps: tractProps };
            const childcareIncentives = filterIncentives('Child Care Services', location);
            const freshFoodIncentives = filterIncentives('Grocery Stores', location);

            // --- Find overlapping incentive areas ---
            const overlappingAreas = [];
            // Select all checkboxes for polygon layers
            const incentiveCheckboxes = document.querySelectorAll('input[onchange="togglePolygonLayer(this)"]');
            incentiveCheckboxes.forEach(checkbox => {
                const layerName = checkbox.dataset.name;
                const layer = overlayLayers[layerName];
                if (layer){
                    if (isPointInLayer_Turf(point, layer)) {
                        // Get the user-friendly name from the label next to the checkbox
                        const label = checkbox.nextElementSibling.textContent.trim();
                        overlappingAreas.push(label);
                    }
                }
            });

            // --- Generate HTML for the list of overlapping areas ---
            let incentiveAreasHTML = '';
            if (overlappingAreas.length > 0) {
                incentiveAreasHTML = `
                    <div class="mt-4">
                        <h4 class="font-semibold text-slate-700 text-sm mb-2">Overlapping Incentive Areas</h4>
                        <ul class="list-disc list-inside space-y-1 text-sm text-slate-700 bg-slate-50 p-3 rounded-lg">
                            ${overlappingAreas.map(area => `<li>${area}</li>`).join('')}
                        </ul>
                    </div>`;
            } else {
                 incentiveAreasHTML = `
                    <div class="mt-4">
                         <p class="text-sm text-slate-600 italic">No currently visible incentive areas overlap this point. Toggle layers on to check for others.</p>
                    </div>`;
            }

            html += `
                <div class="mt-4">
                    <h3 class="text-lg font-semibold text-slate-800 mb-2">Community Context</h3>
                    <div class="p-3 bg-blue-50 border-l-4 border-blue-400 rounded-r-md">
                        <p class="text-sm text-slate-700">This address is in <strong class="font-semibold">${truncateCommunityList(tractProps.tract_name)}, ${tractProps.county_name}</strong>.</p>
                        <button id="view-full-details-btn" class="mt-3 w-full bg-slate-700 text-white py-2 px-4 rounded-lg font-semibold hover:bg-slate-800">Explore Full Community Details</button>
                    </div>
                    
                    ${incentiveAreasHTML}

                    <div class="mt-2">
                        ${createIncentiveListHTML(childcareIncentives, 'Childcare')}
                        ${createIncentiveListHTML(freshFoodIncentives, 'Fresh Food')}
                    </div>
                </div>`;
        }

        panelContent.innerHTML = html;

        if (tractProps) {
            const fullTractFeature = findTractForPoint(point);
            if (fullTractFeature) {
                document.getElementById('view-full-details-btn').onclick = () => displayFeatureInfo(fullTractFeature);
            }
        }

        openSidePanel();
    }

    // --- POINT IN POLYGON HELPERS ---
    function isPointInLayer_Turf(point, layer) {
        if (!point || !layer) return false;

        const turfPoint = [point.lng, point.lat];
        const geojson = layer.toGeoJSON();

        try {
            if (geojson.type === 'FeatureCollection') {
                // If it's a collection, check each feature within it
                for (const feature of geojson.features) {
                    if (turf.booleanPointInPolygon(turfPoint, feature)) {
                        return true; // Found a match, so we're done
                    }
                }
                return false; // Checked all features, no match found
            } else {
                // If it's a single feature, check it directly
                return turf.booleanPointInPolygon(turfPoint, geojson);
            }
        } catch (e) {
            console.error("Turf.js failed to process a geometry.", e, geojson);
            return false; // Prevent the app from crashing on bad data
        }
    }

    // --- MINIMIZABLE CONTROLS LOGIC ---
    const controlsContainer = document.getElementById('map-controls-container');
    const minimizeBtn = document.getElementById('minimize-controls-btn');

    const ShowControlsControl = L.Control.extend({
        onAdd: function(map) {
            const btn = L.DomUtil.create('button', 'leaflet-bar leaflet-control leaflet-control-custom bg-white p-2 rounded-lg shadow-lg');
            btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>`;
            btn.title = "Show Map Controls";
            btn.style.display = 'none'; 

            L.DomEvent.on(btn, 'click', (e) => {
                L.DomEvent.stop(e);
                openControlsPanel();
            });
            return btn;
        },
        onRemove: function(map) {}
    });
    
    showControlsControl = new ShowControlsControl({ position: 'topright' });
    map.addControl(showControlsControl);

    minimizeBtn.addEventListener('click', () => {
        controlsContainer.classList.add('minimized');
        showControlsControl.getContainer().style.display = 'block';
    });
    if (window.innerWidth < 768) {
        controlsContainer.classList.add('minimized');
        showControlsControl.getContainer().style.display = 'block';
    }
}

// --- OVERLAY LAYER TOGGLE LOGIC ---
function toggleTractLayer(checkbox) {
    if (checkbox.checked) { if (!map.hasLayer(geojsonLayer)) map.addLayer(geojsonLayer); } 
    else { if (map.hasLayer(geojsonLayer)) map.removeLayer(geojsonLayer); }
}

async function togglePolygonLayer(checkbox) {
    const layerName = checkbox.dataset.name;
    const url = checkbox.dataset.url;
    if (checkbox.checked) {
        if (overlayLayers[layerName]) { map.addLayer(overlayLayers[layerName]); return; }
        checkbox.parentElement.classList.add('animate-pulse');
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Failed to load ${url}`);
            const data = await response.json();
            const style = incentiveStyles[layerName] || { color: '#000000', weight: 2 };
            const layer = L.geoJSON(data, { style: {...style, pane: 'incentivePane' }, interactive: false });
            overlayLayers[layerName] = layer;
            map.addLayer(layer);
        } catch (error) {
            console.error(`Failed to load ${layerName}:`, error);
            alert(`Could not load the layer: ${layerName}.`);
            checkbox.checked = false;
        } finally {
            checkbox.parentElement.classList.remove('animate-pulse');
        }
    } else {
        if (overlayLayers[layerName]) map.removeLayer(overlayLayers[layerName]);
    }
}

async function togglePointLayer(checkbox) {
    const layerName = checkbox.dataset.name;
    const url = checkbox.dataset.url;
    if (checkbox.checked) {
        if (overlayLayers[layerName]) { map.addLayer(overlayLayers[layerName]); return; }
        checkbox.parentElement.classList.add('animate-pulse');
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Failed to load ${url}`);
            const data = await response.json();
            const markers = L.markerClusterGroup({ clusterPane: 'clusterTopPane' });
            const isChildcare = layerName === 'childcare';
            const pointStyle = { radius: 6, fillColor: isChildcare ? "#fca5a5" : "#6ee7b7", color: "#000", weight: 1, opacity: 1, fillOpacity: 0.8 };

            if (data.type === 'FeatureCollection' && data.features) {
                data.features.forEach(feature => {
                    if (feature.geometry && feature.geometry.type === 'Point') {
                        const { properties, geometry } = feature;
                        const marker = L.circleMarker([geometry.coordinates[1], geometry.coordinates[0]], { ...pointStyle, pane: 'clusterTopPane' });
                        let popupContent = isChildcare ? `
                                <div class="font-bold text-base">${properties.gen_listing_name_original_text || 'N/A'}</div>
                                <div><strong>Capacity (Under 6):</strong> ${properties.licensed_capacity_under6 || 'N/A'}</div>
                            ` : `
                                <div class="font-bold text-base">${properties.name || 'N/A'}</div>
                                <div><strong>Type:</strong> ${properties.tag_label || 'N/A'}</div>
                                <div><strong>Quality:</strong> ${properties.quality || 'N/A'}</div>
                            `;
                        marker.bindPopup(popupContent);
                        markers.addLayer(marker);
                    }
                });
            }
            overlayLayers[layerName] = markers;
            map.addLayer(markers);
        } catch (error) {
            console.error(`Failed to load ${layerName}:`, error);
            alert(`Could not load layer: ${layerName}.`);
            checkbox.checked = false;
        } finally {
             checkbox.parentElement.classList.remove('animate-pulse');
        }
    } else {
        if (overlayLayers[layerName]) map.removeLayer(overlayLayers[layerName]);
    }
}

async function preloadPolygonLayers() {
    const incentiveCheckboxes = document.querySelectorAll('input[onchange="togglePolygonLayer(this)"]');
    
    const loadingPromises = Array.from(incentiveCheckboxes).map(async (checkbox) => {
        const layerName = checkbox.dataset.name;
        const url = checkbox.dataset.url;
        
        // Skip if already loaded for some reason
        if (overlayLayers[layerName]) return;

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Failed to pre-load ${url}`);
            const data = await response.json();
            const style = incentiveStyles[layerName] || { color: '#000000', weight: 2 };
            
            // Create the layer and store it, but DO NOT add it to the map
            const layer = L.geoJSON(data, { style: {...style, pane: 'incentivePane' }, interactive: false });
            overlayLayers[layerName] = layer;
        } catch (error) {
            console.error(`Error pre-loading layer '${layerName}':`, error);
        }
    });

    try {
        await Promise.all(loadingPromises);
    } catch (error) {
        console.error("An error occurred during the pre-loading process.", error);
    }
}

function setAppHeight() {
    const appContainer = document.getElementById('app-container');
    appContainer.style.height = `${window.innerHeight}px`;
    if (map) {
        map.invalidateSize();
    }
}

document.addEventListener('DOMContentLoaded', setAppHeight);
window.addEventListener('resize', setAppHeight);
</script>
