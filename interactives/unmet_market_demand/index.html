<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Development Demand Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background: #f3f4f6;
        }
        ul.list {
            list-style-type: disc;
            list-style-position: inside;
        }
        #map {
            height: 100vh;
            width: 100vw;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
        }
        .custom-control-box {
            background-color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
            z-index: 800;
        }
        .score-legend {
            margin-bottom: 0.5rem;
        }
        .score-legend .score-box {
            display: inline-block;
            width: 22px;
            height: 22px;
            margin-right: 6px;
            border-radius: 4px;
            border: 1px solid #ccc;
            vertical-align: middle;
        }
        .score-legend-label {
            font-size: 13px;
            margin-right: 10px;
            vertical-align: middle;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        @media (max-width: 640px) {
            #narrative-box {
                left: 1rem;
                right: 1rem;
                max-width: none;
                width: calc(100vw - 2rem);
            }
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="map"></div>

    <div id="narrative-box" class="custom-control-box absolute top-4 left-12 max-w-md p-4 bg-white rounded-lg shadow-xl z-[1000] transition-all duration-200">
      <button id="narrative-toggle-btn" class="absolute top-2 right-2 w-7 h-7 flex items-center justify-center rounded-full bg-gray-200 hover:bg-gray-300 text-gray-700 focus:outline-none" title="Minimize">
        <span id="narrative-toggle-icon" class="text-lg leading-none">&#8211;</span>
      </button>
      <h2 class="text-xl font-semibold mt-6 mb-2 text-gray-800">Development Demand Map</h2>
      <div class="dropdown-container mb-2">
        <label for="devType">I'm looking to build </label>
        <select id="devType" class="border rounded px-2 py-1">
            <option value="childcare">Childcare center</option>
            <option value="grocery">Grocery store or supermarket</option>
        </select>
      </div>
      <div class="explanation text-sm text-gray-700 mb-2" id="explanation"></div>
      <div class="flex justify-end gap-2 mt-4" id="prev-next-neigh-btns">
        <button id="prev-neigh-btn" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300 text-gray-700">Previous</button>
        <button id="next-neigh-btn" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300 text-gray-700">Next</button>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script>
    // --- Narrative Minimize/Maximize ---
    const narrativeBox = document.getElementById('narrative-box');
    const narrativeToggleBtn = document.getElementById('narrative-toggle-btn');
    const narrativeToggleIcon = document.getElementById('narrative-toggle-icon');
    const prevNextBtn = document.getElementById('prev-next-neigh-btns');
    let narrativeMinimized = false;
    narrativeToggleBtn.addEventListener('click', () => {
      narrativeMinimized = !narrativeMinimized;
      if (narrativeMinimized) {
        Array.from(narrativeBox.children).forEach(child => {
          if (child !== narrativeToggleBtn && child !== prevNextBtn) child.style.display = 'none';
        });
        narrativeBox.style.padding = '0.5rem';
        narrativeBox.style.width = '10.5rem';
        narrativeBox.style.maxWidth = '10.5rem';
        narrativeBox.style.height = '5rem';
        narrativeBox.style.minHeight = '5rem';
        // Responsive left position for minimized box
        if (window.innerWidth < 640) {
            narrativeBox.style.left = 'unset';
        } else {
            narrativeBox.style.left = '';
            narrativeBox.style.right = '';
        }
        narrativeToggleIcon.innerHTML = '&#43;';
        narrativeToggleBtn.title = "Maximize";
        prevNextBtn.style.paddingTop = '1rem';
      } else {
        Array.from(narrativeBox.children).forEach(child => {
          if (child !== narrativeToggleBtn) child.style.display = '';
        });
        narrativeBox.style.padding = '';
        narrativeBox.style.maxWidth = '';
        narrativeBox.style.height = '';
        narrativeBox.style.minHeight = '';
        if (window.innerWidth < 640) {
            narrativeBox.style.width = 'calc(100vw - 2rem)';
            narrativeBox.style.left = '1rem';
        } else {
            narrativeBox.style.width = '';
            narrativeBox.style.left = '';
            narrativeBox.style.right = '';
        }
        narrativeToggleIcon.innerHTML = '&#8211;';
        narrativeToggleBtn.title = "Minimize";
        prevNextBtn.style.paddingTop = '';
      }
    });

    // Map config
    const map = L.map('map').setView([39.29, -76.61], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CartoDB',
        maxZoom: 19
    }).addTo(map);

    // Data sources
    const devTypes = {
        childcare: {
            label: 'Childcare center',
            quotesProp: 'childcare_demand_quotes',
            points: 'assets/childcare.geojson',
        },
        grocery: {
            label: 'Grocery store or supermarket',
            quotesProp: 'grocery_demand_quotes',
            points: 'assets/grocery.geojson',
        }
    };

    let neighborhoodsLayer = null;
    let supplyLayer = null;
    let neighborhoodsGeojson = null;
    let allNeighborhoodsLayer = null;
    let supplyLayerGroup = null;

    // --- Neighborhood cycling state ---
    let filteredNeighborhoods = [];
    let currentNeighborhoodIdx = -1;
    let neighborhoodLayers = [];

    // Load neighborhoods geojson
    fetch('assets/plan_areas.geojson')
        .then(r => r.json())
        .then(data => {
            neighborhoodsGeojson = data;
            updateMap();
        });

    document.getElementById('devType').addEventListener('change', updateMap);

    function updateMap() {
        // --- Access score helpers ---
        function getAccessScore(feature) {
            const devType = document.getElementById('devType').value;
            if (devType === 'childcare') return feature.properties.childcare_access_score;
            if (devType === 'grocery') return feature.properties.grocery_access_score;
            return null;
        }
        function getPolygonColor(score) {
            if (score == null || isNaN(score)) return '#e0d7ef';
            const colors = ['#d7191c', '#fdae61', '#ffffbf', '#abd9e9', '#2c7bb6'];
            let idx = Math.round(Math.max(1, Math.min(5, score))) - 1;
            return colors[idx];
        }
        const devType = document.getElementById('devType').value;
        const config = devTypes[devType];
        // Remove previous layers
        if (neighborhoodsLayer) map.removeLayer(neighborhoodsLayer);
        if (supplyLayer) map.removeLayer(supplyLayer);
        if (allNeighborhoodsLayer) map.removeLayer(allNeighborhoodsLayer);

        // Show all neighborhoods in grey
        allNeighborhoodsLayer = L.geoJSON(neighborhoodsGeojson, {
            style: { color: '#888', weight: 1, fillOpacity: 0.2, fillColor: '#ccc' },
            interactive: false
        }).addTo(map);

        // Filter polygons by demand
        filteredNeighborhoods = neighborhoodsGeojson.features
            .filter(f => f.properties[config.quotesProp].length > 0)
            .sort((a, b) => {
                const scoreA = getAccessScore(a);
                const scoreB = getAccessScore(b);
                // Handle null/undefined/NaN: treat as lowest
                if (scoreA == null || isNaN(scoreA)) return 1;
                if (scoreB == null || isNaN(scoreB)) return -1;
                return scoreA - scoreB;
            });
        currentNeighborhoodIdx = filteredNeighborhoods.length > 0 ? 0 : -1;
        neighborhoodLayers = [];

        const filtered = {
            ...neighborhoodsGeojson,
            features: filteredNeighborhoods
        };

        function darkenColor(hex, percent) {
            // Remove # if present
            hex = hex.replace(/^#/, '');
            if (hex.length === 3) {
                hex = hex.split('').map(x => x + x).join('');
            }
            let num = parseInt(hex, 16);
            let r = (num >> 16) & 0xFF;
            let g = (num >> 8) & 0xFF;
            let b = num & 0xFF;
            r = Math.max(0, Math.min(255, Math.floor(r * (1 - percent))));
            g = Math.max(0, Math.min(255, Math.floor(g * (1 - percent))));
            b = Math.max(0, Math.min(255, Math.floor(b * (1 - percent))));
            return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }

        neighborhoodsLayer = L.geoJSON(filtered, {
            style: function(feature) {
                const score = getAccessScore(feature);
                const baseColor = getPolygonColor(score);
                const darkColor = darkenColor(baseColor, 0.25); // 25% darker
                return {
                    color: darkColor,
                    weight: 2,
                    fillOpacity: 0.6,
                    fillColor: baseColor
                };
            },
            onEachFeature: function (feature, layer) {
                let popup = `<b>${feature.properties.area_name}`;
                if (feature.properties.plan_year){
                    popup += ` (${feature.properties.plan_year})`;
                }
                popup += `</b><br/>`;
                // Demand quotes
                if (feature.properties[config.quotesProp]) {
                    popup += `<br/><b>Development plan details:</b><ul class="list">`;
                    feature.properties[config.quotesProp].forEach(q => popup += `<li>${q}</li>`);
                    popup += `</ul>`;
                }
                // Access score
                const score = getAccessScore(feature);
                if (score !== undefined && score !== null && !isNaN(score)) {
                    popup += `<br/><b>Access score:</b> <span style='font-weight:bold;'>${score}</span> (1=low, 5=high)`;
                }
                popup += `<br/><a href='pdfs/${feature.properties.pdf_path}' target='_blank' rel='noopener'>Read the full development plan here</a>`
                layer.bindPopup(popup);
                neighborhoodLayers.push(layer);
            }
        }).addTo(map);

        // Fit map to polygons
        if (filtered.features.length > 0) {
            map.fitBounds(neighborhoodsLayer.getBounds());
        } else {
            map.fitBounds(allNeighborhoodsLayer.getBounds());
        }

        // Load and add supply points
        fetch(config.points)
            .then(r => r.json())
            .then(pointsData => {
                // 1. Count tag frequencies
                const tagCounts = {};
                pointsData.features.forEach(f => {
                    const tag = f.properties.tag_label;
                    tagCounts[tag] = (tagCounts[tag] || 0) + 1;
                });
                // 2. Get 9 most common tags
                const topTags = Object.entries(tagCounts)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 8)
                    .map(([tag]) => tag);
                // 3. Replace all other tags with 'Other'
                pointsData.features.forEach(f => {
                    if (!topTags.includes(f.properties.tag_label)) {
                        f.properties.tag_label = 'Other';
                    }
                });
                // 4. Get unique tags (top 9 + 'Other' if present)
                const tags = [...new Set(pointsData.features.map(f => f.properties.tag_label))];
                // 5. Assign colors for quality
                function getQualityColor(quality) {
                    if (quality === 0 || quality === null || quality === undefined || isNaN(quality)) return '#e0d7ef'; // missing
                    const colors = ['#d7191c', '#fdae61', '#ffffbf', '#abd9e9', '#2c7bb6'];
                    let idx = Math.round(Math.max(1, Math.min(5, quality))) - 1;
                    return colors[idx];
                }

                // --- MarkerCluster for supply points ---
                if (supplyLayerGroup) {
                    map.removeLayer(supplyLayerGroup);
                }
                supplyLayerGroup = L.markerClusterGroup({
                    disableClusteringAtZoom: 15,
                    spiderfyOnMaxZoom: true,
                    showCoverageOnHover: false,
                    iconCreateFunction: function(cluster) {
                        // Get all child markers' quality values
                        const markers = cluster.getAllChildMarkers();
                        let qualities = markers.map(m => {
                            let q = m.feature && m.feature.properties ? m.feature.properties.quality : null;
                            return (q === 0 || q === null || q === undefined || isNaN(q)) ? null : Number(q);
                        }).filter(q => q !== null);
                        let avgQuality = qualities.length > 0 ? (qualities.reduce((a, b) => a + b, 0) / qualities.length) : 0;
                        let color = getQualityColor(avgQuality);
                        // Create a custom cluster icon
                        return L.divIcon({
                            html: `<div style='background:${color};opacity:0.8;border:2px solid #fff;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;'><span style='color:#222;font-weight:bold;'>${cluster.getChildCount()}</span></div>`,
                            className: 'custom-cluster-icon',
                            iconSize: [40, 40]
                        });
                    }
                });
                map.addLayer(supplyLayerGroup);

                function renderSupplyPoints() {
                    supplyLayerGroup.clearLayers();
                    // Use L.geoJSON to create circleMarkers, then add to cluster group
                    const geojsonLayer = L.geoJSON(pointsData, {
                        pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
                            radius: 7,
                            fillColor: getQualityColor(feature.properties.quality),
                            color: '#fff',
                            weight: 1,
                            fillOpacity: 0.85
                        }),
                        onEachFeature: function (feature, layer) {
                            let q = feature.properties.quality;
                            let qLabel = (q === 0 || q === null || q === undefined || isNaN(q)) ? 'Missing' : q;
                            layer.bindPopup(`<b>${feature.properties.name} - ${feature.properties.tag_label}</b><br/>Quality: <b>${qLabel}</b>`);
                        }
                    });
                    supplyLayerGroup.addLayer(geojsonLayer);
                }
                renderSupplyPoints();

                // 7. Add legend
                if (window.supplyLegend) map.removeControl(window.supplyLegend);
                window.supplyLegend = L.control({position: 'bottomleft'});
                window.supplyLegend.onAdd = function(map) {
                    const div = L.DomUtil.create('div', 'info legend bg-white p-2 rounded shadow');
                    div.style.fontSize = '14px';
                    // Polygon score legend (access score)
                    div.innerHTML = `<div class='score-legend mb-2'><b>Access Score (Polygon)</b><br>
                        <span class='score-box' style='background:#d7191c'></span><span class='score-legend-label'>1 (low)</span>
                        <span class='score-box' style='background:#fdae61'></span><span class='score-legend-label'>2</span>
                        <span class='score-box' style='background:#ffffbf'></span><span class='score-legend-label'>3</span>
                        <span class='score-box' style='background:#abd9e9'></span><span class='score-legend-label'>4</span>
                        <span class='score-box' style='background:#2c7bb6'></span><span class='score-legend-label'>5 (high)</span>
                    </div>`;
                    // Point quality legend
                    div.innerHTML += `<div class='score-legend mb-2'><b>Quality (Supply Point)</b><br>
                        <span class='score-box' style='background:#e0d7ef'></span><span class='score-legend-label'>0 (missing)</span><br>
                        <span class='score-box' style='background:#d7191c'></span><span class='score-legend-label'>1 (low)</span><br>
                        <span class='score-box' style='background:#fdae61'></span><span class='score-legend-label'>2</span><br>
                        <span class='score-box' style='background:#ffffbf'></span><span class='score-legend-label'>3</span><br>
                        <span class='score-box' style='background:#abd9e9'></span><span class='score-legend-label'>4</span><br>
                        <span class='score-box' style='background:#2c7bb6'></span><span class='score-legend-label'>5 (best)</span>
                    </div>`;
                    return div;
                };
                window.supplyLegend.addTo(map);

                // --- Explanation ---
                document.getElementById('explanation').innerHTML = `Neighborhoods are colored by their <b>access score</b> (red=low, blue=high) for the selected service, based on proximity and density of supply. Highlighted neighborhoods have expressed demand for a <b>${config.label}</b> in their neighborhood development plans. The dots show current supply and are color-coded by quality according to the legend. Click the buttons below to see all the neighborhoods with this demand, or click on a neighborhood or dot for more details.`;
            }); // <-- This closes the fetch(config.points).then(...)
    }

    // --- Previous/Next button logic ---
    function showNeighborhood(idx) {
        if (filteredNeighborhoods.length === 0 || idx < 0 || idx >= filteredNeighborhoods.length) return;
        currentNeighborhoodIdx = idx;
        const feature = filteredNeighborhoods[idx];
        const layer = neighborhoodLayers[idx];
        if (layer) {
            map.fitBounds(layer.getBounds(), { maxZoom: 15 });
            setTimeout(() => {
                layer.openPopup();
            }, 400);
        }
    }

    document.getElementById('prev-neigh-btn').addEventListener('click', function() {
        if (filteredNeighborhoods.length === 0) return;
        let idx = (currentNeighborhoodIdx - 1 + filteredNeighborhoods.length) % filteredNeighborhoods.length;
        showNeighborhood(idx);
    });
    document.getElementById('next-neigh-btn').addEventListener('click', function() {
        if (filteredNeighborhoods.length === 0) return;
        let idx = (currentNeighborhoodIdx + 1) % filteredNeighborhoods.length;
        showNeighborhood(idx);
    });

    // Optionally, show the first neighborhood on load if any
    // window.addEventListener('DOMContentLoaded', () => {
    //   if (filteredNeighborhoods.length > 0) showNeighborhood(0);
    // });
    </script>
</body>
</html>
