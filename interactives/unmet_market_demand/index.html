<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baltimore Development Demand Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background: #f3f4f6;
        }
        #map {
            height: 100vh;
            width: 100vw;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
        }
        .custom-control-box {
            background-color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
            z-index: 800;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        @media (max-width: 640px) {
            #narrative-box {
                left: 1rem;
                right: 1rem;
                max-width: none;
                width: calc(100vw - 2rem);
            }
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="map"></div>

    <div id="narrative-box" class="custom-control-box absolute top-4 left-12 max-w-md p-4 bg-white rounded-lg shadow-xl z-[1000] transition-all duration-200">
      <button id="narrative-toggle-btn" class="absolute top-2 right-2 w-7 h-7 flex items-center justify-center rounded-full bg-gray-200 hover:bg-gray-300 text-gray-700 focus:outline-none" title="Minimize">
        <span id="narrative-toggle-icon" class="text-lg leading-none">&#8211;</span>
      </button>
      <h2 class="text-xl font-semibold mt-6 mb-2 text-gray-800">Baltimore Development Demand Map</h2>
      <div class="dropdown-container mb-2">
        <label for="devType">I'm looking to build a </label>
        <select id="devType" class="border rounded px-2 py-1">
            <option value="grocery">Grocery store or supermarket</option>
            <option value="pharmacy">Pharmacy or drug store</option>
            <option value="bank">Bank or credit union</option>
            <option value="hardware">Home improvement or hardware store</option>
        </select>
      </div>
      <div class="explanation text-sm text-gray-700 mb-2" id="explanation"></div>
      <div class="flex justify-end gap-2 mt-4" id="prev-next-neigh-btns">
        <button id="prev-neigh-btn" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300 text-gray-700">Previous</button>
        <button id="next-neigh-btn" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300 text-gray-700">Next</button>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script>
    // --- Narrative Minimize/Maximize ---
    const narrativeBox = document.getElementById('narrative-box');
    const narrativeToggleBtn = document.getElementById('narrative-toggle-btn');
    const narrativeToggleIcon = document.getElementById('narrative-toggle-icon');
    const prevNextBtn = document.getElementById('prev-next-neigh-btns');
    let narrativeMinimized = false;
    narrativeToggleBtn.addEventListener('click', () => {
      narrativeMinimized = !narrativeMinimized;
      if (narrativeMinimized) {
        Array.from(narrativeBox.children).forEach(child => {
          if (child !== narrativeToggleBtn && child !== prevNextBtn) child.style.display = 'none';
        });
        narrativeBox.style.padding = '0.5rem';
        narrativeBox.style.width = '10.5rem';
        narrativeBox.style.maxWidth = '10.5rem';
        narrativeBox.style.height = '5rem';
        narrativeBox.style.minHeight = '5rem';
        // Responsive left position for minimized box
        if (window.innerWidth < 640) {
            narrativeBox.style.left = 'unset';
        } else {
            narrativeBox.style.left = '';
            narrativeBox.style.right = '';
        }
        narrativeToggleIcon.innerHTML = '&#43;';
        narrativeToggleBtn.title = "Maximize";
        prevNextBtn.style.paddingTop = '1rem';
      } else {
        Array.from(narrativeBox.children).forEach(child => {
          if (child !== narrativeToggleBtn) child.style.display = '';
        });
        narrativeBox.style.padding = '';
        narrativeBox.style.maxWidth = '';
        narrativeBox.style.height = '';
        narrativeBox.style.minHeight = '';
        if (window.innerWidth < 640) {
            narrativeBox.style.width = 'calc(100vw - 2rem)';
            narrativeBox.style.left = '1rem';
        } else {
            narrativeBox.style.width = '';
            narrativeBox.style.left = '';
            narrativeBox.style.right = '';
        }
        narrativeToggleIcon.innerHTML = '&#8211;';
        narrativeToggleBtn.title = "Minimize";
        prevNextBtn.style.paddingTop = '';
      }
    });

    // Map config
    const map = L.map('map').setView([39.29, -76.61], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CartoDB',
        maxZoom: 19
    }).addTo(map);

    // Data sources
    const devTypes = {
        grocery: {
            label: 'Grocery store or supermarket',
            demandProp: 'desires_grocery_stores_and_supermarkets',
            quotesProp: 'desires_grocery_stores_and_supermarkets_quotes',
            points: 'assets/grocery.geojson',
        },
        pharmacy: {
            label: 'Pharmacy or drug store',
            demandProp: 'desires_pharmacies_and_drug_stores',
            quotesProp: 'desires_pharmacies_and_drug_stores_quotes',
            points: 'assets/pharmacy.geojson',
        },
        bank: {
            label: 'Bank or credit union',
            demandProp: 'desires_banks_and_financial_services',
            quotesProp: 'desires_banks_and_financial_services_quotes',
            points: 'assets/financial.geojson',
        },
        hardware: {
            label: 'Home improvement or hardware store',
            demandProp: 'desires_home_improvement_and_hardware_stores',
            quotesProp: 'desires_home_improvement_and_hardware_stores_quotes',
            points: 'assets/home_repair.geojson',
        }
    };

    let neighborhoodsLayer = null;
    let supplyLayer = null;
    let neighborhoodsGeojson = null;
    let allNeighborhoodsLayer = null;
    let supplyLayerGroup = null;

    // --- Neighborhood cycling state ---
    let filteredNeighborhoods = [];
    let currentNeighborhoodIdx = -1;
    let neighborhoodLayers = [];

    // Persona mapping
    const personaProps = [
        {
            key: 'persona_historic_rooted',
            label: 'Historic and rooted',
            quotes: 'persona_historic_rooted_quotes',
            description: 'Communities with a strong sense of identity grounded in their history, distinctive architecture, and long-term residents. They often boast a "small-town feel" within the city, valuing neighborly connections and cultural institutions.'
        },
        {
            key: 'persona_reclaiming_revitalizing',
            label: 'Reclaiming and revitalizing',
            quotes: 'persona_reclaiming_revitalizing_quotes',
            description: 'Communities grappling with significant blight, high vacancy rates, and persistent social challenges like crime and drug activity. However, they are also characterized by strong, active residents and community organizations who are determined to reclaim their neighborhoods through strategic revitalization efforts, advocating for better services, and attracting new investment.'
        },
        {
            key: 'persona_stable_suburban_like_urban',
            label: 'Stable suburban-like urban',
            quotes: 'persona_stable_suburban_like_urban_quotes',
            description: 'Well-established communities that enjoy a high quality of life, characterized by strong homeownership, well-maintained homes, and ample green spaces. They often project a more suburban or "country-like" feel while still being within city limits. Their primary focus is on preserving their existing strengths and quality, rather than extensive revitalization.'
        },
        {
            key: 'persona_dynamic_evolving',
            label: 'Dynamic and evolving',
            quotes: 'persona_dynamic_evolving_quotes',
            description: 'Areas that are actively undergoing significant change, often driven by new development, proximity to major institutions, or re-envisioning of their commercial or industrial past. They are typically diverse and seek to grow into mixed-use, vibrant hubs, but face the complex task of integrating new growth with existing communities while managing urban challenges.'
        }
    ];

    // Load neighborhoods geojson
    fetch('assets/baltimore_area.geojson')
        .then(r => r.json())
        .then(data => {
            neighborhoodsGeojson = data;
            updateMap();
        });

    document.getElementById('devType').addEventListener('change', updateMap);

    function updateMap() {
        const devType = document.getElementById('devType').value;
        const config = devTypes[devType];
        // Remove previous layers
        if (neighborhoodsLayer) map.removeLayer(neighborhoodsLayer);
        if (supplyLayer) map.removeLayer(supplyLayer);
        if (allNeighborhoodsLayer) map.removeLayer(allNeighborhoodsLayer);

        // Show all neighborhoods in grey
        allNeighborhoodsLayer = L.geoJSON(neighborhoodsGeojson, {
            style: { color: '#888', weight: 1, fillOpacity: 0.2, fillColor: '#ccc' },
            interactive: false
        }).addTo(map);

        // Filter polygons by demand
        filteredNeighborhoods = neighborhoodsGeojson.features.filter(f => f.properties[config.demandProp] === true || f.properties[config.demandProp] === 'True');
        currentNeighborhoodIdx = filteredNeighborhoods.length > 0 ? 0 : -1;
        neighborhoodLayers = [];

        const filtered = {
            ...neighborhoodsGeojson,
            features: filteredNeighborhoods
        };

        neighborhoodsLayer = L.geoJSON(filtered, {
            style: { color: '#e67e22', weight: 2, fillOpacity: 0.4, fillColor: '#e67e22' },
            onEachFeature: function (feature, layer) {
                let popup = `<b>${feature.properties.AREA_NAME} (Plan ${feature.properties.STATUS})</b><br/>`;
                // Persona
                personaProps.forEach(p => {
                    if (feature.properties[p.key] === true || feature.properties[p.key] === 'True') {
                        popup += `<br/><b>Neighborhood persona:</b> <span style='cursor:help' title='${p.description}'>${p.label}</span><br/>`;
                    }
                });
                // Demand quotes
                if (feature.properties[config.quotesProp]) {
                    popup += `<br/><b>Comprehensive plan details:</b><ul>`;
                    feature.properties[config.quotesProp].forEach(q => popup += `<li>${q}</li>`);
                    popup += `</ul>`;
                }
                popup += `<br/><a href='pdfs/${feature.properties.OBJECTID}.pdf' target='_blank' rel='noopener'>Read the full comprehensive plan here</a>`
                layer.bindPopup(popup);
                neighborhoodLayers.push(layer);
            }
        }).addTo(map);

        // Fit map to polygons
        if (filtered.features.length > 0) {
            map.fitBounds(neighborhoodsLayer.getBounds());
        } else {
            map.fitBounds(allNeighborhoodsLayer.getBounds());
        }

        // Load and add supply points
        fetch(config.points)
            .then(r => r.json())
            .then(pointsData => {
                // 1. Count tag frequencies
                const tagCounts = {};
                pointsData.features.forEach(f => {
                    const tag = f.properties.tag_label;
                    tagCounts[tag] = (tagCounts[tag] || 0) + 1;
                });
                // 2. Get 9 most common tags
                const topTags = Object.entries(tagCounts)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 9)
                    .map(([tag]) => tag);
                // 3. Replace all other tags with 'Other'
                pointsData.features.forEach(f => {
                    if (!topTags.includes(f.properties.tag_label)) {
                        f.properties.tag_label = 'Other';
                    }
                });
                // 4. Get unique tags (top 9 + 'Other' if present)
                const tags = [...new Set(pointsData.features.map(f => f.properties.tag_label))];
                // 5. Assign colors
                const colorScale = (function() {
                    const palette = [
                        '#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd','#8c564b','#e377c2','#7f7f7f','#bcbd22','#17becf',
                        '#cccccc' // for 'Other'
                    ];
                    return tag => {
                        const idx = tags.indexOf(tag);
                        return palette[idx % palette.length];
                    };
                })();

                // --- Tag filtering state ---
                let activeTags = new Set(tags);
                if (supplyLayerGroup) {
                    map.removeLayer(supplyLayerGroup);
                }
                supplyLayerGroup = L.layerGroup().addTo(map);

                function renderSupplyPoints() {
                    supplyLayerGroup.clearLayers();
                    L.geoJSON(pointsData, {
                        filter: feature => activeTags.has(feature.properties.tag_label),
                        pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
                            radius: 7,
                            fillColor: colorScale(feature.properties.tag_label),
                            color: '#fff',
                            weight: 1,
                            fillOpacity: 0.7
                        }),
                        onEachFeature: function (feature, layer) {
                            layer.bindPopup(`<b>${feature.properties.name}</b><br/>${feature.properties.tag_label}`);
                        }
                    }).addTo(supplyLayerGroup);
                }

                function attachLegendClickHandlers() {
                    document.querySelectorAll('.legend-item').forEach(el => {
                        el.onclick = function() {
                            const tag = this.getAttribute('data-tag');
                            if (activeTags.has(tag)) {
                                if (activeTags.size === 1) return; // Prevent hiding all
                                activeTags.delete(tag);
                            } else {
                                activeTags.add(tag);
                            }
                            renderSupplyPoints();
                            // Re-render legend to update opacity and re-attach handlers
                            window.supplyLegend.remove();
                            window.supplyLegend.addTo(map);
                            attachLegendClickHandlers();
                        };
                    });
                }
                renderSupplyPoints();

                // 7. Add legend
                if (window.supplyLegend) map.removeControl(window.supplyLegend);
                window.supplyLegend = L.control({position: 'bottomleft'});
                window.supplyLegend.onAdd = function(map) {
                    const div = L.DomUtil.create('div', 'info legend bg-white p-2 rounded shadow');
                    div.style.fontSize = '14px';
                    // Sort tags alphabetically, but always put 'Other' last if present
                    const sortedTags = tags.filter(t => t !== 'Other').sort((a, b) => a.localeCompare(b));
                    if (tags.includes('Other')) sortedTags.push('Other');
                    div.innerHTML = '<b>Supply Type</b><br>' +
                        sortedTags.map(tag => `<span class="legend-item" data-tag="${tag}" style="display:inline-block;width:14px;height:14px;background:${colorScale(tag)};margin-right:6px;border-radius:3px;border:1px solid #ccc;cursor:pointer;opacity:${activeTags.has(tag)?'1':'0.3'};"></span><span style="cursor:pointer;opacity:${activeTags.has(tag)?'1':'0.3'};" class="legend-item" data-tag="${tag}">${tag}</span>`).join('<br>');
                    return div;
                };
                window.supplyLegend.addTo(map);
                attachLegendClickHandlers();

                // --- Explanation ---
                document.getElementById('explanation').innerHTML = `Neighborhoods highlighted in orange have expressed demand for a <b>${config.label}</b> in their comprehensive plans. The dots show current supply and are color-coded by type according to the legend. <b>You can click legend items to filter supply types on the map; active types are fully colored, while inactive types are faded.</b> Click the buttons below to see all the neighborhoods with this demand, or click on a neighborhood or dot for more details.`;
            }); // <-- This closes the fetch(config.points).then(...)
    }

    // --- Previous/Next button logic ---
    function showNeighborhood(idx) {
        if (filteredNeighborhoods.length === 0 || idx < 0 || idx >= filteredNeighborhoods.length) return;
        currentNeighborhoodIdx = idx;
        const feature = filteredNeighborhoods[idx];
        const layer = neighborhoodLayers[idx];
        if (layer) {
            map.fitBounds(layer.getBounds(), { maxZoom: 15 });
            setTimeout(() => {
                layer.openPopup();
            }, 400);
        }
    }

    document.getElementById('prev-neigh-btn').addEventListener('click', function() {
        if (filteredNeighborhoods.length === 0) return;
        let idx = (currentNeighborhoodIdx - 1 + filteredNeighborhoods.length) % filteredNeighborhoods.length;
        showNeighborhood(idx);
    });
    document.getElementById('next-neigh-btn').addEventListener('click', function() {
        if (filteredNeighborhoods.length === 0) return;
        let idx = (currentNeighborhoodIdx + 1) % filteredNeighborhoods.length;
        showNeighborhood(idx);
    });

    // Optionally, show the first neighborhood on load if any
    // window.addEventListener('DOMContentLoaded', () => {
    //   if (filteredNeighborhoods.length > 0) showNeighborhood(0);
    // });
    </script>
</body>
</html>
