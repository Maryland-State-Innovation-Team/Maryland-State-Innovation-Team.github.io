<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Innovation Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none; /* Prevents pull-to-refresh on mobile */
        }
        .chart-container {
            width: 100%;
            max-width: 800px; /* Max width for the chart */
            margin: 0 auto;
            touch-action: manipulation; /* Improves touch responsiveness */
        }
        .axis-label {
            font-size: 0.8rem;
            fill: #4A5568; /* gray-700 */
        }
        .grid line {
            stroke: #E2E8F0; /* gray-300 */
            stroke-opacity: 0.7;
            shape-rendering: crispEdges;
        }
        .grid path {
            stroke-width: 0;
        }
        .bubble {
            stroke-width: 3px;
            cursor: pointer;
            transition: r 0.3s ease, opacity 0.3s ease;
        }
        .bubble:hover {
            opacity: 0.7;
        }
        .tooltip {
            position: absolute;
            text-align: center;
            padding: 8px;
            font-size: 0.8rem;
            background: white;
            border: 1px solid #CBD5E0; /* gray-400 */
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .arc-path {
            fill-opacity: 0.15;
            stroke: none;
        }
        .arc-label {
            font-size: 0.85rem; /* Adjusted for better fit */
            font-weight: 600;
            fill: #2D3748; /* gray-800 */
            text-anchor: middle;
        }
        .legend-item, .legend-item-border {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .legend-color-box {
            width: 1rem;
            height: 1rem;
            margin-right: 0.5rem;
            border-radius: 0.25rem;
        }
        .legend-item-border .legend-color-box{
            border: 3px solid;
        }
        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 p-4 md:p-8 min-h-screen flex flex-col items-center">

    <!-- Description Box (show/hide) -->
    <div id="description-box" class="w-full max-w-4xl bg-blue-50 border border-blue-200 rounded-lg shadow p-5 mb-4 relative">
        <button id="desc-toggle-btn" class="absolute top-2 right-2 px-2 py-1 text-xs rounded bg-blue-100 hover:bg-blue-200 text-blue-700 font-semibold focus:outline-none mb-1">Hide Description</button>
        <div id="desc-content">
            <!-- Content will be filled by JS -->
        </div>
    </div>

    <div class="w-full max-w-4xl bg-white p-6 rounded-lg shadow-xl">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div>
                <!-- <label for="x-axis-select" class="block text-sm font-medium text-gray-700 mb-1">Horizontal Axis:</label> -->
                <select id="x-axis-select" class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"></select>
            </div>
            <div>
                <!-- <label for="y-axis-select" class="block text-sm font-medium text-gray-700 mb-1">Vertical Axis:</label> -->
                <select id="y-axis-select" class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"></select>
            </div>
        </div>

        <div class="flex flex-col lg:flex-row gap-6">
            <div class="chart-container flex-grow">
                <svg id="innovation-chart" class="w-full h-auto" viewbox="0 0 600 600"></svg>
            </div>

            <div id="legend" class="w-full lg:w-1/4 p-4 bg-gray-50 rounded-lg shadow">
                <h3 class="text-lg font-semibold mb-3 text-blue-600">Legend</h3>
                </div>
        </div>
    </div>

    <div id="tooltip" class="tooltip"></div>

    <script>
        // --- Data Definitions ---
        const initialIndicators = [
            { id: 'novelty', name: 'Novelty', description: 'From existing to new innovation' },
            { id: 'formality', name: 'Required formality', description: 'From internal optimization to regulatory change' },
            { id: 'urbanRural', name: 'Location', description: 'From urban to rural' },
            { id: 'timeframe', name: 'Time frame', description: 'From quick win to slow burn' },
            { id: 'agencyScope', name: 'Agency scope', description: 'From single-agency to cross-agency' },
            { id: 'funding', name: 'Funding', description: 'From has existing funding to needs external funding' }
        ];

        const initialBubblesData = [
            {
                id: 1,

                novelty: 8,

            },
            {

            },

            },

            },
            {

                crosscut: 'ENOUGH',
                novelty: 1,
                urbanRural: 5,

            {

                formality: 1,
                timeframe: 2,

            },
            {
                id: 7,

        ];

        // --- Arc Label Logic ---
        // Defines different sets of arc labels based on X and Y indicator combinations.
        // The key is "indicator1-indicator2" in alphabetical order.
        const arcLabelSets = {
            'default': { core: 'Core', adjacent: 'Adjacent', transformational: 'Transformational' },
            'novelty-novelty': { core: 'Existing', adjacent: 'Semi-New', transformational: 'Brand New' },
            'urbanRural-urbanRural': { core: 'Urban', adjacent: 'Suburban', transformational: 'Rural' },
            'formality-formality': { core: 'Internal Opt.', adjacent: 'Semi-Formal', transformational: 'Regulatory' },
            'timeframe-timeframe': { core: 'Quick Win', adjacent: 'Mid-Term', transformational: 'Slow Burn' },
            'agencyScope-agencyScope': { core: 'Single-Agency', adjacent: 'Multi-Agency', transformational: 'Cross-Agency' },
            'funding-funding': { core: 'Existing Funds', adjacent: 'Partial Funds', transformational: 'New Funds' },
            'novelty-urbanRural': { core: 'Existing Urban', adjacent: 'Semi-New Suburban', transformational: 'New Rural' },
            'formality-novelty': { core: 'Core', adjacent: 'Adjacent', transformational: 'Transformational' },
            'novelty-timeframe': { core: 'Existing Quick Win', adjacent: 'Semi-New Mid-Term', transformational: 'New Slow Burn' },
            'agencyScope-novelty': { core: 'Existing Single-Agency', adjacent: 'Semi-New Multi-Agency', transformational: 'New Cross-Agency' },
            'funding-novelty': { core: 'Funded Existing', adjacent: 'Part-Funded New', transformational: 'Unfunded New' },
            'formality-urbanRural': { core: 'Urban Internal Opt.', adjacent: 'Suburban Semi-Formal', transformational: 'Rural Regulatory' },
            'timeframe-urbanRural': { core: 'Urban Quick Win', adjacent: 'Suburban Mid-Term', transformational: 'Rural Slow Burn' },
            'agencyScope-urbanRural': { core: 'Urban Single-Agency', adjacent: 'Suburban Multi-Agency', transformational: 'Rural Cross-Agency' },
            'funding-urbanRural': { core: 'Funded Urban', adjacent: 'Part-Funded Suburban', transformational: 'Unfunded Rural' },
            'formality-timeframe': { core: 'Internal Opt. Quick Win', adjacent: 'Semi-Formal Mid-Term', transformational: 'Regulatory Slow Burn' },
            'agencyScope-formality': { core: 'Single-Agency Internal Opt.', adjacent: 'Multi-Agency Semi-Formal', transformational: 'Cross-Agency Regulatory' },
            'formality-funding': { core: 'Funded Internal Opt.', adjacent: 'Part-Funded Semi-Formal', transformational: 'Unfunded Regulatory' },
            'agencyScope-timeframe': { core: 'Single-Agency Quick Win', adjacent: 'Multi-Agency Mid-Term', transformational: 'Cross-Agency Slow Burn' },
            'funding-timeframe': { core: 'Funded Quick Win', adjacent: 'Part-Funded Mid-Term', transformational: 'Unfunded Slow Burn' },
            'agencyScope-funding': { core: 'Funded Single-Agency', adjacent: 'Part-Funded Multi-Agency', transformational: 'Unfunded Cross-Agency' },
        };
        let currentArcLabels = arcLabelSets.default;

        // --- Color Scale for focusAreas ---
        const focusAreas = [...new Set(initialBubblesData.map(d => d.focusArea))];
        const colorScale = d3.scaleOrdinal(["#c94a36", "#050d5e", "#a89473"]).domain(focusAreas);

        // -- Color scale for crosscutting themes
        const crosscuttingThemes = [...new Set(initialBubblesData.map(d => d.crosscut).filter(d => d !== undefined))];
        const crosscutColorScale = d3.scaleOrdinal(d3.schemeCategory10).domain(crosscuttingThemes);

        // --- Arc Label Explanations ---
        const arcLabelExplanations = {
            'default': {
                core: 'Optimizing existing solutions for existing stakeholders.',
                adjacent: 'Expanding from existing solutions into "new to us."',
                transformational: 'Developing breakthroughs and inventing things for markets that do not exist yet.'
            },
            'novelty-novelty': {
                core: 'Focusing on initiatives and solutions that are already established.',
                adjacent: 'Adapting established solutions for a new context or purpose.',
                transformational: 'Creating entirely new solutions or capabilities from the ground up.'
            },
            'urbanRural-urbanRural': {
                core: 'Addressing the specific needs and opportunities within urban centers.',
                adjacent: 'Expanding efforts to serve communities at the edge of the city.',
                transformational: 'Branching out to address the unique challenges of rural areas.'
            },
            'formality-formality': {
                core: 'Improving current processes and systems within the existing structure.',
                adjacent: 'Introducing new practices that may exist outside of formal protocols.',
                transformational: 'Driving fundamental shifts by creating or altering official regulations.'
            },
            'timeframe-timeframe': {
                core: 'Implementing projects that deliver immediate and tangible results.',
                adjacent: 'Pursuing initiatives with a mid-term scope that requires sustained effort.',
                transformational: 'Investing in long-term, foundational projects that will unfold over time.'
            },
            'agencyScope-agencyScope': {
                core: 'Focusing on projects managed entirely within our own agency.',
                adjacent: 'Collaborating with a few partner agencies to achieve a shared goal.',
                transformational: 'Leading broad initiatives that span multiple agencies and sectors.'
            },
            'funding-funding': {
                core: 'Leveraging currently allocated budgets and financial resources.',
                adjacent: 'Combining existing funds with a search for new financial support.',
                transformational: 'Seeking entirely new sources of funding for groundbreaking projects.'
            },
            'novelty-urbanRural': {
                core: 'Optimizing established solutions for the needs of urban communities.',
                adjacent: 'Adapting known approaches to serve new purposes in suburban areas.',
                transformational: 'Developing brand-new initiatives to address unique rural challenges.'
            },
            'formality-novelty': {
                core: 'Optimizing existing solutions for existing stakeholders.',
                adjacent: 'Expanding from existing solutions into "new to us."',
                transformational: 'Developing breakthroughs and inventing things for markets that do not exist yet.'
            },
            'novelty-timeframe': {
                core: 'Getting quick results by implementing established, proven solutions.',
                adjacent: 'Adapting known solutions for new purposes over a moderate timeframe.',
                transformational: 'Investing in the long-term development of entirely new, groundbreaking ideas.'
            },
            'agencyScope-novelty': {
                core: 'Improving our agency\'s existing work with proven, internal solutions.',
                adjacent: 'Collaborating with partners to adapt existing solutions for a new purpose.',
                transformational: 'Leading a broad coalition to create something that has never been done before.'
            },
            'funding-novelty': {
                core: 'Using our current budget to support and improve established projects.',
                adjacent: 'Partially funding the adaptation of existing ideas for new uses.',
                transformational: 'Seeking new investment to pioneer completely new and unfunded concepts.'
            },
            'formality-urbanRural': {
                core: 'Improving our internal processes to better serve urban areas.',
                adjacent: 'Introducing semi-formal changes to expand our reach into the suburbs.',
                transformational: 'Driving regulatory change to create new opportunities in rural communities.'
            },
            'timeframe-urbanRural': {
                core: 'Achieving fast, tangible results on projects within urban centers.',
                adjacent: 'Undertaking mid-term projects to expand our impact in suburban areas.',
                transformational: 'Committing to long-term initiatives to foster growth in rural communities.'
            },
            'agencyScope-urbanRural': {
                core: 'Focusing our agency’s efforts on initiatives within urban centers.',
                adjacent: 'Partnering with other agencies to serve suburban communities.',
                transformational: 'Leading a broad coalition to address the unique needs of rural areas.'
            },
            'funding-urbanRural': {
                core: 'Using our existing budget for projects focused on urban communities.',
                adjacent: 'Partially funding initiatives to expand our work into suburban areas.',
                transformational: 'Seeking new investment to launch critical projects in rural communities.'
            },
            'formality-timeframe': {
                core: 'Making swift internal improvements for immediate gains.',
                adjacent: 'Implementing semi-formal changes over a moderate period.',
                transformational: 'Undertaking the long-term process of driving fundamental regulatory change.'
            },
            'agencyScope-formality': {
                core: 'Improving our own agency\'s processes and efficiency.',
                adjacent: 'Working with partners to implement new, semi-formal practices.',
                transformational: 'Leading a broad effort to make sweeping, official changes to regulations.'
            },
            'formality-funding': {
                core: 'Using our current budget to make internal improvements.',
                adjacent: 'Partially funding new, semi-formal approaches to our work.',
                transformational: 'Seeking new investment to drive significant regulatory reform.'
            },
            'agencyScope-timeframe': {
                core: 'Achieving rapid results on projects we can handle entirely on our own.',
                adjacent: 'Collaborating with partners on initiatives with a mid-term timeline.',
                transformational: 'Leading long-term, foundational projects that span multiple organizations.'
            },
            'funding-timeframe': {
                core: 'Using our current budget to achieve fast and tangible outcomes.',
                adjacent: 'Partially funding projects that will deliver results in the mid-term.',
                transformational: 'Seeking new investment for long-term projects with transformative potential.'
            },
            'agencyScope-funding': {
                core: 'Using our own budget to fund projects managed by our agency.',
                adjacent: 'Partially funding collaborative projects with partner agencies.',
                transformational: 'Seeking new investment for large-scale initiatives that involve many organizations.'
            }
        };

        // --- D3 Setup ---
        const svg = d3.select("#innovation-chart");
        const tooltip = d3.select("#tooltip");
        const legendContainer = d3.select("#legend");

        const margin = { top: 60, right: 30, bottom: 60, left: 60 }; // Increased top margin for arc labels
        let width, height; // To be set by resize

        const xScale = d3.scaleLinear().domain([0, 10]).range([0, null]); // Range set on resize
        const yScale = d3.scaleLinear().domain([0, 10]).range([null, 0]); // Range set on resize
        const impactScale = d3.scaleSqrt().domain([1, 10]).range([5, 25]); // Bubble size

        const xAxisGrid = d3.axisBottom(xScale).tickSize(-height).tickFormat('').ticks(10);
        const yAxisGrid = d3.axisLeft(yScale).tickSize(-width).tickFormat('').ticks(10);

        // --- Axis Selectors ---
        const xAxisSelect = d3.select("#x-axis-select");
        const yAxisSelect = d3.select("#y-axis-select");

        initialIndicators.forEach(indicator => {
            xAxisSelect.append("option").attr("value", indicator.id).text(indicator.name);
            yAxisSelect.append("option").attr("value", indicator.id).text(indicator.name);
        });

        // Set initial selections (can be different for X and Y)
        xAxisSelect.property("value", initialIndicators[0].id);
        yAxisSelect.property("value", initialIndicators[1].id);

        let currentXIndicatorId = xAxisSelect.property("value");
        let currentYIndicatorId = yAxisSelect.property("value");

        // --- Drawing Functions ---

        function updateArcLabels() {
            const indicatorKeys = [currentXIndicatorId, currentYIndicatorId].sort();
            const combinationKey = `${indicatorKeys[0]}-${indicatorKeys[1]}`;
            currentArcLabels = arcLabelSets[combinationKey] || arcLabelSets.default;

            svg.selectAll(".arc-label-transformational").text(currentArcLabels.transformational);
            svg.selectAll(".arc-label-adjacent").text(currentArcLabels.adjacent);
            svg.selectAll(".arc-label-core").text(currentArcLabels.core);
        }


        let nodes = initialBubblesData.map(d => Object.assign({}, d));
        let simulation = null;

        function drawChart() {
            // Get current dimensions
            const chartContainer = d3.select(".chart-container").node();
            if (!chartContainer) return;

            const newWidth = chartContainer.getBoundingClientRect().width - margin.left - margin.right;
            const newHeight = newWidth; // Maintain square aspect ratio for the plot area
            
            // Update SVG viewbox and internal dimensions if they changed significantly
            if (Math.abs(newWidth - width) > 1 || Math.abs(newHeight - height) > 1 || !width) {
                width = newWidth;
                height = newHeight;

                svg.attr("viewBox", `0 0 ${width + margin.left + margin.right} ${height + margin.top + margin.bottom}`);
                
                xScale.range([0, width]);
                yScale.range([height, 0]);

                xAxisGrid.tickSize(-height);
                yAxisGrid.tickSize(-width);
            }
            
            svg.selectAll(".static-group").remove(); // Remove only static chart elements

            // Static chart elements (grid, axes, arcs, labels)
            const staticGroup = svg.append("g")
                .attr("class", "static-group")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            // Draw Grid
            staticGroup.append("g")
                .attr("class", "grid x-grid")
                .attr("transform", `translate(0,${height})`)
                .call(xAxisGrid);
            staticGroup.append("g")
                .attr("class", "grid y-grid")
                .call(yAxisGrid);

            // Draw Arcs (Paths)
            const maxRadius = Math.min(width, height);
            const arcRadii = [maxRadius * 0.525, maxRadius * 0.875, maxRadius];
            const arcData = [
                { id: 'core', color: '#6EE7B7', path: `M 0 ${height} L ${arcRadii[0]} ${height} A ${arcRadii[0]} ${arcRadii[0]} 0 0 0 0 ${height - arcRadii[0]} Z` },
                { id: 'adjacent', color: '#34D399', path: `M 0 ${height} L ${arcRadii[1]} ${height} A ${arcRadii[1]} ${arcRadii[1]} 0 0 0 0 ${height - arcRadii[1]} Z` }
            ];
            staticGroup.selectAll(".arc-path")
                .data(arcData.slice().reverse())
                .enter().append("path")
                .attr("class", d => `arc-path arc-${d.id}`)
                .attr("d", d => d.path)
                .style("fill", d => d.color);

            // Draw Axes
            staticGroup.append("g")
                .attr("transform", `translate(0,${height})`)
                .call(d3.axisBottom(xScale).ticks(5));
            staticGroup.append("g")
                .call(d3.axisLeft(yScale).ticks(5));

            // Axis Labels
            staticGroup.append("text")
                .attr("class", "axis-label")
                .attr("text-anchor", "middle")
                .attr("x", width / 2)
                .attr("y", height + margin.bottom / 1.5)
                .text(initialIndicators.find(ind => ind.id === currentXIndicatorId)?.name || 'X Axis');

            staticGroup.append("text")
                .attr("class", "axis-label")
                .attr("text-anchor", "middle")
                .attr("transform", "rotate(-90)")
                .attr("x", -height / 2)
                .attr("y", -margin.left / 1.5)
                .text(initialIndicators.find(ind => ind.id === currentYIndicatorId)?.name || 'Y Axis');

            updateArcLabels();

            // --- Bubbles: persistent selection ---
            // Update target positions
            nodes.forEach(d => {
                d.targetX = xScale(d[currentXIndicatorId]);
                d.targetY = yScale(d[currentYIndicatorId]);
            });

            // Bubble group (ensure it's always on top)
            let bubbleGroup = svg.select("g.bubble-group");
            if (bubbleGroup.empty()) {
                bubbleGroup = svg.append("g").attr("class", "bubble-group").attr("transform", `translate(${margin.left},${margin.top})`);
            } else {
                // Move bubbleGroup to the end so it's above static elements
                bubbleGroup.attr("transform", `translate(${margin.left},${margin.top})`);
                svg.node().appendChild(bubbleGroup.node());
            }

            // Data join
            let bubbles = bubbleGroup.selectAll(".bubble").data(nodes, d => d.id);

            // Enter
            bubbles.enter().append("circle")
                .attr("class", "bubble")
                .attr("r", d => impactScale(d.impact))
                .attr("cx", d => d.x !== undefined ? d.x : d.targetX)
                .attr("cy", d => d.y !== undefined ? d.y : d.targetY)
                .style("fill", d => colorScale(d.focusArea))
                .style("stroke", d => d.crosscut ? crosscutColorScale(d.crosscut) : "transparent")
                .on("mouseover", function(event, d) {
                    tooltip.transition().duration(200).style("opacity", .9);
                    const xIndicator = initialIndicators.find(ind => ind.id === currentXIndicatorId);
                    const yIndicator = initialIndicators.find(ind => ind.id === currentYIndicatorId);
                    tooltip.html(
                        `<strong>${d.name}</strong><br/>
                        Focus area: ${d.focusArea}<br/>
                        ${d.crosscut ? 'Cross-cutting theme: ' + d.crosscut + '<br/>' : ''}
                        Impact: ${d.impact}<br/>
                        ${xIndicator?.name || 'X'}: ${d[currentXIndicatorId]}<br/>
                        ${yIndicator?.name || 'Y'}: ${d[currentYIndicatorId]}`
                    )
                    .style("left", (event.pageX + 15) + "px")
                    .style("top", (event.pageY - 28) + "px");
                    d3.select(this).attr("r", impactScale(d.impact) * 1.2);
                })
                .on("mouseout", function(event, d) {
                    tooltip.transition().duration(500).style("opacity", 0);
                    d3.select(this).attr("r", impactScale(d.impact));
                });

            // Exit
            bubbles.exit().remove();

            // --- D3 Force Simulation for smooth movement ---
            if (simulation) simulation.stop();
            simulation = d3.forceSimulation(nodes)
                .force("x", d3.forceX(d => d.targetX).strength(0.1))
                .force("y", d3.forceY(d => d.targetY).strength(0.1))
                .force("collide", d3.forceCollide(d => impactScale(d.impact) + 2))
                .alpha(0.8)
                .alphaDecay(0.03)
                .on("tick", () => {
                    bubbleGroup.selectAll(".bubble")
                        .attr("cx", d => d.x)
                        .attr("cy", d => d.y);
                });

            // Remove any existing arc-label-group
            svg.selectAll('.arc-label-group').remove();
            // Draw arc labels in a new group above bubbles
            const arcLabelGroup = svg.append('g')
                .attr('class', 'arc-label-group')
                .attr('transform', `translate(${margin.left},${margin.top})`);
            arcLabelGroup.append('text')
                .attr('class', 'arc-label arc-label-transformational')
                .attr('x', width * 0.85)
                .attr('y', height * 0.15)
                .attr('dy', '-0.5em')
                .text(currentArcLabels.transformational);
            arcLabelGroup.append('text')
                .attr('class', 'arc-label arc-label-adjacent')
                .attr('x', width * 0.5)
                .attr('y', height * 0.5)
                .attr('dy', '-0.5em')
                .text(currentArcLabels.adjacent);
            arcLabelGroup.append('text')
                .attr('class', 'arc-label arc-label-core')
                .attr('x', width * 0.15)
                .attr('y', height * 0.85)
                .attr('dy', '-0.5em')
                .text(currentArcLabels.core);
        }

        // --- Legend ---
        function drawLegend() {
            legendContainer.selectAll("*").remove(); // Clear previous legend
            legendContainer.append("h3")
                .attr("class", "text-lg font-semibold mb-3 text-blue-600")
                .text("Legend");

            legendContainer.append("h4")
                .attr("class", "text-md font-semibold mb-3 text-blue-600")
                .text("Focus areas");

            const legendItems = legendContainer.selectAll(".legend-item")
                .data(focusAreas)
                .enter().append("div")
                .attr("class", "legend-item text-sm");

            legendItems.append("div")
                .attr("class", "legend-color-box")
                .style("background-color", d => colorScale(d));

            legendItems.append("span")
                .text(d => d);

            legendContainer.append("h4")
                .attr("class", "text-md font-semibold mb-3 text-blue-600")
                .text("Cross-cutting themes");

            const legendBorderItems = legendContainer.selectAll(".legend-item-border")
                .data(crosscuttingThemes)
                .enter().append("div")
                .attr("class", "legend-item-border text-sm");

            legendBorderItems.append("div")
                .attr("class", "legend-color-box")
                .style("border-color", d => crosscutColorScale(d));

            legendBorderItems.append("span")
                .text(d => d);
        }

        // --- Description Box Logic ---
        const descBox = document.getElementById('description-box');
        const descContent = document.getElementById('desc-content');
        const descToggleBtn = document.getElementById('desc-toggle-btn');

        function updateDescriptionBox() {
            const xInd = initialIndicators.find(ind => ind.id === currentXIndicatorId);
            const yInd = initialIndicators.find(ind => ind.id === currentYIndicatorId);
            const indicatorKeys = [currentXIndicatorId, currentYIndicatorId].sort();
            const combinationKey = `${indicatorKeys[0]}-${indicatorKeys[1]}`;
            const arcLabels = currentArcLabels;
            const arcExplanations = arcLabelExplanations[combinationKey] || arcLabelExplanations['default'];
            descContent.innerHTML = `
                <p class="mb-2 text-sm text-gray-800">
                    <span class="font-semibold">${xInd?.name || ''}:</span> ${xInd?.description || ''}<br>
                    <span class="font-semibold">${yInd?.name || ''}:</span> ${yInd?.description || ''}
                </p>
                <p class="mb-2 text-sm text-gray-800">
                    <span class="font-semibold">${arcLabels.core}:</span> ${arcExplanations.core}<br>
                    <span class="font-semibold">${arcLabels.adjacent}:</span> ${arcExplanations.adjacent}<br>
                    <span class="font-semibold">${arcLabels.transformational}:</span> ${arcExplanations.transformational}
                </p>
            `;
        }

        descToggleBtn.addEventListener('click', function() {
            if (descContent.style.display === 'none') {
                descContent.style.display = '';
                descToggleBtn.textContent = 'Hide Description';
            } else {
                descContent.style.display = 'none';
                descToggleBtn.textContent = 'Show Description';
            }
        });

        // Call this after updating arc labels or indicator selection
        function updateAllDescriptions() {
            updateArcLabels();
            updateDescriptionBox();
        }

        // --- Event Listeners ---
        xAxisSelect.on("change", function() {
            currentXIndicatorId = d3.select(this).property("value");
            updateAllDescriptions();
            drawChart();
        });

        yAxisSelect.on("change", function() {
            currentYIndicatorId = d3.select(this).property("value");
            updateAllDescriptions();
            drawChart();
        });
        
        // --- Initial Draw and Resize Handling ---
        function initialize() {
            drawLegend();
            updateDescriptionBox();
            // Use ResizeObserver for better performance and accuracy
            new ResizeObserver(entries => {
                if (entries && entries.length > 0) {
                    // Potentially debounce or throttle if needed, but usually fine for ResizeObserver
                    drawChart();
                }
            }).observe(d3.select(".chart-container").node());
            
            drawChart(); // Initial draw
        }

        // Wait for the DOM to be fully loaded
        document.addEventListener('DOMContentLoaded', initialize);

    </script>
</body>
</html>
